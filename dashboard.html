<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
.card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
.card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
.card .unit { font-size: 18px; color: #aaa; }
.card.hot .value { color: #dc3545; }
.status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; }
.status-online { background: #d4edda; color: #155724; }
.status-offline { background: #f8d7da; color: #721c24; }
#alert { display: none; background: #dc3545; color: white; padding: 15px 20px; border-radius: 12px;
         margin-bottom: 25px; font-weight: 600; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
.panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
.controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
.btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; }
.btn-on { background: #28a745; } .btn-off { background: #dc3545; } .btn-set { background: #667eea; }
input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; width: 120px; font-size: 15px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
#log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px;
       max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
#log .error { color: #f66; } #log .info { color: #6af; }
</style>
</head>
<body>
<div class="container">
  <h1>🌡️ IoT Dashboard — REST API</h1>

  <div id="alert"></div>

  <div class="cards">
    <div class="card" id="card-suhu"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
    <div class="card"><div class="label">Batas Suhu</div><div class="value" id="threshold">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;"><span class="status-badge status-offline" id="status-badge">OFFLINE</span></div></div>
  </div>

  <div class="panel">
    <h2>📈 Grafik Real-time (WebSocket)</h2>
    <canvas id="chart" height="110"></canvas>
  </div>

  <div class="panel">
    <h2>🎛️ Kontrol &amp; Pengaturan</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">💡 Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">🌙 Matikan Lampu</button>
      <input type="number" id="input-threshold" placeholder="Batas °C" step="0.1" min="1">
      <button class="btn btn-set" onclick="setThreshold()">Simpan Batas Suhu</button>
    </div>
  </div>

  <div class="panel">
    <h2>📋 10 Data Sensor Terakhir (dari SQLite)</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="panel"><h2>🧾 Log Aktivitas</h2><div id="log"></div></div>
</div>

<script>
// ===== KONFIGURASI =====
const API_BASE = 'http://localhost:1880/api';
const WS_URL = 'ws://localhost:1880/ws/sensor';
const API_KEY = 'iot-rahasia-2026';   // autentikasi sederhana (header X-API-Key)
const MAX_POINTS = 20;

const $ = id => document.getElementById(id);
let rows = [], lastData = 0, currentThreshold = null;

function log(msg, type = 'info') {
  const el = $('log');
  el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ===== GRAFIK Chart.js =====
const chart = new Chart($('chart'), {
  type: 'line',
  data: { labels: [], datasets: [
    { label: 'Suhu (°C)', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231,76,60,.15)', tension: .3, fill: true },
    { label: 'Kelembaban (%)', data: [], borderColor: '#3498db', tension: .3 },
    { label: 'Batas suhu', data: [], borderColor: '#f39c12', borderDash: [6, 6], pointRadius: 0 }
  ]},
  options: { animation: false, responsive: true }
});

function pushPoint(d) {
  chart.data.labels.push(new Date(d.received).toLocaleTimeString());
  chart.data.datasets[0].data.push(d.suhu);
  chart.data.datasets[1].data.push(d.kelembaban);
  chart.data.datasets[2].data.push(d.threshold ?? currentThreshold);
  if (chart.data.labels.length > MAX_POINTS) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(ds => ds.data.shift());
  }
}

// ===== TAMPILAN =====
function setStatus(online) {
  const b = $('status-badge');
  b.textContent = online ? 'ONLINE' : 'OFFLINE';
  b.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}

function updateCards(d) {
  $('suhu').textContent = d.suhu;
  $('kelembaban').textContent = d.kelembaban;
  if (d.threshold !== undefined) { currentThreshold = d.threshold; $('threshold').textContent = d.threshold; }
  const hot = d.alert === true;
  $('card-suhu').classList.toggle('hot', hot);
  const box = $('alert');
  box.style.display = hot ? 'block' : 'none';
  if (hot) box.textContent = `⚠️ PERINGATAN! Suhu ${d.suhu}°C melewati batas ${d.threshold}°C`;
  setStatus(true);
}

function renderTable() {
  $('history-body').innerHTML = rows.length ? rows.map(d => `
    <tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('')
    : '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
}

// ===== DATA MASUK (WebSocket) =====
function handleData(d) {
  lastData = Date.now();
  updateCards(d);
  pushPoint(d);
  chart.update();
  rows.unshift(d);
  rows = rows.slice(0, 10);
  renderTable();
}

function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => log('WebSocket terhubung (update tanpa polling)');
  ws.onmessage = e => { try { handleData(JSON.parse(e.data)); } catch (err) { log('Pesan WebSocket tidak valid', 'error'); } };
  ws.onclose = () => { log('WebSocket terputus, mencoba lagi dalam 3 detik...', 'error'); setTimeout(connectWS, 3000); };
}

// ===== MUAT DATA AWAL (REST) =====
async function loadInitial() {
  try {
    const s = await (await fetch(`${API_BASE}/suhu`)).json();
    if (s.status === 'success' && s.data.suhu !== null) updateCards(s.data);
    const h = await (await fetch(`${API_BASE}/history`)).json();
    const data = h.data || [];
    data.slice(-MAX_POINTS).forEach(pushPoint);
    chart.update();
    rows = data.slice(-10).reverse();
    renderTable();
    log(`Riwayat dimuat dari database: ${h.count} data`);
  } catch (err) { log(`Gagal memuat data awal: ${err.message}`, 'error'); }
}

// ===== KONTROL (POST, butuh API key) =====
async function kontrol(device, action) {
  try {
    const res = await fetch(`${API_BASE}/kontrol`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify({ device, action })
    });
    const json = await res.json();
    json.status === 'success' ? log(`✓ Perintah terkirim: ${device} → ${action}`) : log(`✗ Gagal: ${json.message}`, 'error');
  } catch (err) { log(`✗ Error kontrol: ${err.message}`, 'error'); }
}

// ===== THRESHOLD (PUT, butuh API key) =====
async function setThreshold() {
  const val = Number($('input-threshold').value);
  try {
    const res = await fetch(`${API_BASE}/threshold`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify({ threshold: val })
    });
    const json = await res.json();
    if (json.status === 'success') {
      currentThreshold = json.threshold;
      $('threshold').textContent = json.threshold;
      log(`✓ Batas suhu diubah menjadi ${json.threshold}°C`);
    } else { log(`✗ Gagal: ${json.message}`, 'error'); }
  } catch (err) { log(`✗ Error threshold: ${err.message}`, 'error'); }
}

// ===== START =====
log('Dashboard dimulai');
loadInitial();
connectWS();
setInterval(() => { if (lastData && Date.now() - lastData > 10000) setStatus(false); }, 2000);
</script>
</body>
</html>
